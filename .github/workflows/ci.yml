name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pacchetto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            showcase/package-lock.json

      - name: Package dependencies
        run: npm ci

      - name: The committed tokens.css is what tokens.json generates
        run: |
          npm run tokens
          git diff --exit-code -- src/tokens.css

      - name: Component and token tests (vitest, jsdom)
        run: npm test

      - name: Build (svelte-package)
        run: npm run build

      - name: Subpath exports load in plain Node, without the Svelte compiler
        run: node --input-type=module -e "const t = await import('plancia-ui/theme'); const l = await import('plancia-ui/labels'); l.setLabels({ close: 'x' }); if (typeof t.applyStoredTheme !== 'function' || l.getLabels().close !== 'x') throw new Error('subpath exports broken')"

      - name: What would go to npm
        run: npm pack --dry-run

      - name: Showcase — dependencies, svelte-check, build
        working-directory: showcase
        run: |
          npm ci
          npm run check
          npm run build
